<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <title>Whether Application</title>
  <link rel="stylesheet" href="whether application.css">
</head>

<body>
  <!-- <-------search bar------->
  <section class="container">
    <div class="weather_header">
      <form class="weather_search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" class="city_name" placeholder="Search your city" />
      </form>
    </div>


    <!-- whether main data -->

    <div class="weather_body">
      <h1 class="weather_city"></h1>
      <p class="weather_datetime"></p>
      <div class="weather_data">
        <p class="weather_forecast"></p>
        <div class="weather_icon"></div>
      </div>

      <div class="weather_minmax">
        <div>
          <p class="weather_temperature"></p>
        </div>

        <p class="weather_min"></p>
        <p class="weather_max"></p>
      </div>
    </div>

    <!-- whether Extra data -->
    <section class="weather_info">
      <!-- First card -->
      <div class="weather_card"><i class="fa-solid fa-temperature-three-quarters"></i>
        <div>
          <p>Feels Like</p>
          <p class="whether_feelslike"></p>
        </div>
      </div>




      <!-- second card -->
      <div class="weather_card">
        <i class="fa-solid fa-droplet"></i>
        <div>
          <p>Humidity</p>
          <p class="whether_humudity">89%</p>
        </div>
      </div>

      <!-- third card -->

      <div class="weather_card"><i class="fa-solid fa-wind"></i>
        <div>
          <p>Wind</p>
          <p class="wind"></p>
        </div>
      </div>

      <!-- forth card -->


      <div class="weather_card">
        <i class="fa-solid fa-gauge-high"></i>
        <div>
          <p>Pressure</p>
          <p class="presure"></p>
        </div>
      </div>
    </section>
  </section>
  <script src="whether application.js"></script>
</body>

</html>
