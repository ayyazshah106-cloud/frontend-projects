<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="600" height="520" role="img" aria-label="Casual Slim Fit T-shirt" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff7a00" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff7a00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fabric" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="0.5" stop-color="#ff8a1f"/>
      <stop offset="1" stop-color="#e65a00"/>
    </linearGradient>
    <linearGradient id="sleeveShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- background glow + ring -->
  <ellipse cx="300" cy="250" rx="290" ry="250" fill="url(#glow)"/>
  <circle cx="300" cy="250" r="215" fill="none" stroke="#ff8a1f" stroke-opacity="0.18" stroke-width="2" stroke-dasharray="4 10"/>

  <!-- floor shadow -->
  <ellipse cx="300" cy="462" rx="150" ry="14" fill="#000" fill-opacity="0.45"/>

  <!-- T-shirt body -->
  <g filter="url(#soft)">
    <path d="M235 80 L150 112 L78 212 L134 244 L172 200 L178 428 Q300 442 422 428 L428 200 L466 244 L522 212 L450 112 L365 80 Q300 145 235 80 Z"
          fill="url(#fabric)"/>
  </g>

  <!-- sleeve shading -->
  <path d="M150 112 L78 212 L134 244 L172 200 Z" fill="url(#sleeveShade)"/>
  <path d="M450 112 L522 212 L466 244 L428 200 Z" fill="#000" fill-opacity="0.12"/>

  <!-- fabric folds -->
  <path d="M215 190 Q240 300 205 420" fill="none" stroke="#000" stroke-opacity="0.12" stroke-width="10" stroke-linecap="round"/>
  <path d="M385 200 Q365 310 395 424" fill="none" stroke="#000" stroke-opacity="0.12" stroke-width="10" stroke-linecap="round"/>
  <path d="M270 210 Q300 250 330 210" fill="none" stroke="#fff" stroke-opacity="0.12" stroke-width="14" stroke-linecap="round"/>

  <!-- highlight on left shoulder -->
  <path d="M240 92 L160 120 L120 178" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round"/>

  <!-- collar -->
  <path d="M235 80 Q300 145 365 80" fill="none" stroke="#7a2e00" stroke-width="14" stroke-linecap="round"/>
  <path d="M242 82 Q300 132 358 82" fill="none" stroke="#ffd09a" stroke-width="3" stroke-linecap="round"/>

  <!-- stitching -->
  <path d="M88 214 L138 240" stroke="#7a2e00" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M512 214 L462 240" stroke="#7a2e00" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M184 410 Q300 424 416 410" fill="none" stroke="#7a2e00" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- chest logo -->
  <text x="300" y="262" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" font-style="italic" letter-spacing="3" fill="#1a1d29" fill-opacity="0.85">SHOP</text>
  <rect x="262" y="274" width="76" height="4" rx="2" fill="#1a1d29" fill-opacity="0.6"/>

  <!-- sparkles -->
  <g fill="#ffd09a">
    <path d="M500 90 l5 14 l14 5 l-14 5 l-5 14 l-5 -14 l-14 -5 l14 -5 z" opacity="0.9"/>
    <path d="M90 360 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z" opacity="0.7"/>
    <circle cx="540" cy="340" r="4" opacity="0.6"/>
    <circle cx="70" cy="120" r="3" opacity="0.5"/>
  </g>
</svg>
